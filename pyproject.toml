[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-public-service"
version = "0.1.0"
description = "A reproducible, constraint-aware retrieval engine for public-service directories."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TRACE contributors" }]
dependencies = []

[project.scripts]
trace-pantry = "trace_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
